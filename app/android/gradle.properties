org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# tor-android 0.4.9.x ships class files newer than Jetifier's bytecode parser
# can read (major version 68). It is already an androidx library, so there is
# nothing for Jetifier to rewrite in it — pass it through untouched.
android.jetifier.ignorelist=tor-android
