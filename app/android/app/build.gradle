plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is explicit. A release task without all four values fails
// instead of silently falling back to Android's public debug key.
def releaseStorePath = System.getenv("MRNOBODY_KEYSTORE")
def releaseStorePassword = System.getenv("MRNOBODY_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("MRNOBODY_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MRNOBODY_KEY_PASSWORD")
def releaseSigningReady = [
        releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains("release")
}
if (releaseRequested && !releaseSigningReady) {
    throw new GradleException("Release signing is not configured. Set MRNOBODY_KEYSTORE, "
            + "MRNOBODY_STORE_PASSWORD, MRNOBODY_KEY_ALIAS and MRNOBODY_KEY_PASSWORD.")
}

android {
    namespace = "com.mrnobody.browser"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.mrnobody.browser"
        // Android 12+ (matches the product's minSdk decision).
        minSdk = 31
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                storeType = "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    // Background task resumption for the Java agent core (spec §13).
    implementation "androidx.work:work-runtime:2.9.1"

    // Compat wrapper over the *system* WebView -- no browser engine is bundled,
    // so this costs kilobytes, not megabytes. It is what provides genuine
    // per-profile storage isolation (MULTI_PROFILE), the proxy override, and
    // pre-page script injection, each feature-detected at runtime because they
    // depend on the installed WebView rather than the OS version.
    implementation "androidx.webkit:webkit:1.11.0"

    // JVM unit tests for the agent core. The core is deliberately written so
    // its logic (routing, parsing, filtering, policy, reconciliation) runs on a
    // plain JVM without an Android runtime — these tests are the reason it
    // stays that way.
    testImplementation "junit:junit:4.13.2"

    // org.json is an Android library, not part of plain Java — include it
    // explicitly so JVM tests can compile and run SearchResultsJson tests.
    testImplementation "org.json:json:20231013"
}

flutter {
    source = "../.."
}
