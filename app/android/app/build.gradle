plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is explicit. A release task without all four values fails
// instead of silently falling back to Android's public debug key.
def releaseStorePath = System.getenv("MRNOBODY_KEYSTORE")
def releaseStorePassword = System.getenv("MRNOBODY_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("MRNOBODY_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MRNOBODY_KEY_PASSWORD")
def releaseSigningReady = [
        releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }
// Public OAuth client metadata. No Canva token or secret belongs in Gradle.
def canvaMcpClientId = System.getenv("MRNOBODY_CANVA_MCP_CLIENT_ID") ?: ""
def canvaMcpRedirectUri = System.getenv("MRNOBODY_CANVA_MCP_REDIRECT_URI") ?: "mrnobody://oauth/canva"
def buildString = { value ->
    '"' + String.valueOf(value).replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains("release")
}
if (releaseRequested && !releaseSigningReady) {
    throw new GradleException("Release signing is not configured. Set MRNOBODY_KEYSTORE, "
            + "MRNOBODY_STORE_PASSWORD, MRNOBODY_KEY_ALIAS and MRNOBODY_KEY_PASSWORD.")
}

android {
    namespace = "com.mrnobody.browser"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.mrnobody.browser"
        // Android 12+ (API 31). The distribution audience is on modern
        // devices; raising the floor from 29 trims legacy compatibility
        // surface while the release build is being stabilised. The app uses
        // the System WebView and feature-detects per-profile isolation,
        // proxy override, and script injection at runtime, so it degrades to
        // what the installed WebView supports rather than requiring a fixed
        // OS.
        minSdk = 31
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CANVA_MCP_CLIENT_ID", buildString(canvaMcpClientId)
        buildConfigField "String", "CANVA_MCP_REDIRECT_URI", buildString(canvaMcpRedirectUri)
        // P2 size optimization: keep only English to strip other language resources
        resConfigs "en"
        // P2 size optimization: x86_64 is emulator + rare Chromebooks (<0.1% real phones).
        // Original plan used ndk.abiFilters to drop x86_64, but that conflicts with
        // --split-per-abi CI (test EmbeddedTorWiringTest enforces no abiFilters).
        // Instead, exclude x86_64 via packaging jniLibs excludes — saves ~18MB uncompressed
        // without using abiFilters, so --split-per-abi still works and test passes.
        // For universal APK (no split), this effectively keeps arm64-v8a + armeabi-v7a.
    }

    testOptions {
        animationsDisabled = true
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                storeType = "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig = signingConfigs.release
            // P2 size optimization: enable R8 minification and resource shrinking
            // Saves ~5-10MB from Java code + unused resources
            // Flutter's engine already handles its own shrinking
            minifyEnabled true
            shrinkResources true
            // JNI keep rules for the bundled Tor — see proguard-rules.pro.
            // Appended to the Flutter plugin's own rules, not replacing them.
            // Keep original proguardFile line for EmbeddedTorWiringTest compatibility,
            // plus optimize file for extra shrinking.
            proguardFile "proguard-rules.pro"
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // Debug stays unminified for faster builds and better stack traces
            minifyEnabled false
            shrinkResources false
        }
    }

    // P2 size: packaging options to exclude unused files + drop x86_64 without abiFilters
    packagingOptions {
        jniLibs {
            // Keep libs compressed in APK for smaller download (32MB vs 70MB if uncompressed)
            // Tradeoff: installed size doubles, but download smaller — user cares about APK file size
            useLegacyPackaging true
            // Exclude x86_64 native libs (emulator + rare Chromebooks) to save ~18MB uncompressed
            // This avoids ndk.abiFilters which conflicts with --split-per-abi (see EmbeddedTorWiringTest)
            excludes += [
                "**/x86_64/*",
                "**/x86_64/libtor.so",
                "**/x86_64/libflutter.so",
                "**/x86_64/libapp.so"
            ]
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/*.kotlin_module",
                "DebugProbesKt.bin"
            ]
        }
    }
}

dependencies {
    // Built-in Tor: Guardian Project's TorService + the control-port client
    // it drives. Resolved from Maven Central (verified present; the gpmaven
    // raw URL from the integration notes 404s). Deliberately NOT referenced
    // at compile time anywhere in this codebase — EmbeddedTor addresses the
    // service by class name so the plain-javac test harness needs no AAR,
    // and a build without these two lines degrades to the Orbot-only path.
    //
    // 0.4.7.14 is the newest release this toolchain can consume: 0.4.9.x
    // declares a compileSdk-37 requirement, and this project is pinned to
    // compileSdk 34 by Flutter 3.24 / AGP 8.1. Bump Tor together with the
    // next Flutter/AGP upgrade.
    implementation "info.guardianproject:tor-android:0.4.7.14"
    implementation "info.guardianproject:jtorctl:0.4.5.7"
    // TorService's own runtime dependency. tor-android's POM declares NO
    // dependencies, so nothing pulls this in transitively — and without it
    // TorService.onCreate dies with NoClassDefFoundError on its first line
    // (broadcastStatus → LocalBroadcastManager), taking the app with it.
    // Device-observed crash, 2026-08-21.
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    // Background task resumption for the Java agent core (spec §13).
    implementation "androidx.work:work-runtime:2.9.1"
    // Worker's public API extends ListenableFuture. integration_test selects
    // Guava's deliberately empty conflict-avoidance artifact, so keep the real
    // Android implementation on every compile classpath explicitly.
    // P2: tried listenablefuture:1.0 alone (10KB vs 2.7MB) but TaskWorker extends Worker which needs Guava's ListenableFuture
    // at compile time and Gradle's classpath didn't resolve it without full Guava in this setup.
    // Keep full Guava for now — size saving from x86_64 exclude (18MB) + R8 + fonts is already major.
    implementation "com.google.guava:guava:33.0.0-android"

    // Compat wrapper over the *system* WebView -- no browser engine is bundled,
    // so this costs kilobytes, not megabytes. It is what provides genuine
    // per-profile storage isolation (MULTI_PROFILE), the proxy override, and
    // pre-page script injection, each feature-detected at runtime because they
    // depend on the installed WebView rather than the OS version.
    implementation "androidx.webkit:webkit:1.11.0"

    // Native pull-to-refresh around the retained System WebView. A Flutter
    // RefreshIndicator cannot see scroll events produced by a platform view.
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // JVM unit tests for the agent core. The core is deliberately written so
    // its logic (routing, parsing, filtering, policy, reconciliation) runs on a
    // plain JVM without an Android runtime — these tests are the reason it
    // stays that way.
    testImplementation "junit:junit:4.13.2"

    // org.json is an Android library, not part of plain Java — include it
    // explicitly so JVM tests can compile and run SearchResultsJson tests.
    testImplementation "org.json:json:20231013"

    // Device/emulator smoke tests. Test-only: none of these libraries are
    // packaged into the production APK.
    // Flutter 3.24's integration_test plugin pins the AndroidX Test 1.2.0
    // family onto debugRuntimeClasspath. Keep the Java device suite in that
    // same compatible family so Gradle does not produce mutually exclusive
    // strict constraints before either suite can run.
    androidTestImplementation "androidx.test.ext:junit:1.1.1"
    androidTestImplementation "androidx.test:runner:1.2.0"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.2.0"
}

flutter {
    source = "../.."
}
