name: mrnobody
description: "Mr Nobody — a small, private, agentic browser."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  # No WebView plugin: the visible page is our own Android WebView hosted as a
  # platform view (see android/.../webview/MrNobodyWebView.java). A plugin
  # cannot express shouldInterceptRequest, and without that the filter engine
  # is off the request path — i.e. no ad/tracker blocking at all.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Inter (UI) + JetBrains Mono (values/labels), matching the approved
  # wireframe. Bundled as subset static instances (latin, ~620 KB total) so the
  # app NEVER fetches a font at runtime — a remote font request would leak an
  # IP address on every cold start, which this product does not do.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
