plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrnobody.browser'
    compileSdk 35

    defaultConfig {
        applicationId "com.mrnobody.browser"
        // Android 12+ (API 31): V2 uses modern platform APIs and Android 12's
        // hardened WebView/permission model. Documented in docs/ARCHITECTURE.md.
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // R8 + resource shrinking keep us inside the 20–45 MB target.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TESTING ONLY: sign with the auto-generated debug key so the APK
            // is installable. Replace with a real keystore (GitHub Secrets)
            // before any Play Store distribution — never ship the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Minimal dependency footprint. No analytics, no ads, no tracking SDKs.
    // 1.6.1 (not 1.7.x) to avoid a transitive Kotlin-stdlib version clash in
    // this pure-Java project.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
