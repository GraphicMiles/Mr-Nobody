plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrnobody.browser'
    compileSdk 35

    defaultConfig {
        applicationId "com.mrnobody.browser"
        // Android 8.0+ (API 26) so we can ship adaptive icons without legacy
        // bitmap mipmaps, keeping the APK tiny. Documented in docs/ARCHITECTURE.md.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // R8 + resource shrinking keep us inside the 20–45 MB target.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Minimal dependency footprint. No analytics, no ads, no tracking SDKs.
    // 1.6.1 (not 1.7.x) to avoid a transitive Kotlin-stdlib version clash in
    // this pure-Java project.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
