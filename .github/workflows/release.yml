name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK size gate
        run: python3 tools/apk_size_check.py android/app/build/outputs/apk/release/app-release-unsigned.apk 45

      - name: Checksums
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signing is intentionally NOT included here: release signing keys must be
      # stored in GitHub Actions Secrets and referenced by the release workflow,
      # never committed. This file builds unsigned artifacts until a maintainer
      # configures the signing job (see docs/ARCHITECTURE.md).
