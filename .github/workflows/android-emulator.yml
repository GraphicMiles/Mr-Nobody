name: Android Emulator Smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-smoke:
    name: API ${{ matrix.api-level }} device smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      # Generates local.properties and catches a native/Flutter debug build
      # failure before spending time booting an emulator.
      - name: Build debug application and instrumentation APKs
        run: |
          cd app
          flutter build apk --debug
          cd android
          ./gradlew :app:assembleDebugAndroidTest --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: |
            evidence="$GITHUB_WORKSPACE/emulator-artifacts/api-${{ matrix.api-level }}"
            mkdir -p "$evidence"
            collect_evidence() {
              adb logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$evidence/window.xml" >/dev/null 2>&1 || true
              adb exec-out screencap -p > "$evidence/final-screen.png" 2>/dev/null || true
              adb pull /sdcard/Android/data/com.mrnobody.browser/files/device-smoke.png \
                "$evidence/device-smoke.png" >/dev/null 2>&1 || true
              adb shell dumpsys activity processes > "$evidence/activity-processes.txt" 2>&1 || true
              adb shell dumpsys jobscheduler > "$evidence/jobscheduler.txt" 2>&1 || true
              adb shell dumpsys notification > "$evidence/notifications.txt" 2>&1 || true
            }
            trap collect_evidence EXIT
            cd app/android
            ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            emulator-artifacts/api-${{ matrix.api-level }}
            app/build/app/reports/androidTests/connected
            app/build/app/outputs/androidTest-results/connected
