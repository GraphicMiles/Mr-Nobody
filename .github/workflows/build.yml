name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Python tooling checks
        run: |
          python3 tools/filter_validation.py
          python3 tools/privacy_audit.py

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Build debug APK (installable, debug-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (R8 + shrinking, debug-signed for install)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK size gate (hard limit 45 MB)
        run: python3 tools/apk_size_check.py android/app/build/outputs/apk/release/app-release.apk 45

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: mrnobody-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
