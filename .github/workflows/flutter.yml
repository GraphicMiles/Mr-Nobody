name: Flutter Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos

      # The product's privacy claims are checked mechanically: prohibited
      # permissions, analytics/ad SDKs, JS bridges, cleartext traffic.
      - name: Privacy audit
        run: python3 tools/privacy_audit.py .

      # Widget + golden tests. The goldens are the UI-parity gate against
      # prototype/interactive-wireframe.html: if a screen drifts, this fails.
      - name: Tests (widgets + screen goldens)
        working-directory: app
        run: flutter test

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/failures
          if-no-files-found: ignore

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Report APK size
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          size=$(stat -c%s "$apk")
          echo "APK: $((size / 1024 / 1024)) MB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mrnobody-flutter-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
