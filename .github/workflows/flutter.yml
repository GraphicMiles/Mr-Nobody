name: Flutter Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep durable project documentation consolidated in the developer guide
      # and roadmap. Run before dependency resolution so generated files cannot
      # affect the tracked-file check.
      - name: Documentation surface
        run: |
          # website/ is the shipped landing page (served by the update
          # server), and server/README.md documents that service — both are
          # product surface, not free-form docs. Everything else stays
          # consolidated in README.md and ROADMAP.md.
          expected=$(printf 'CODE-AUDIT.md\nREADME.md\nROADMAP.md\nserver/README.md\nwebsite/desktop.html\nwebsite/index.html\nwebsite/mobile.html')
          actual=$(git ls-files '*.md' '*.mdx' '*.html' '*.htm' '*.rst' '*.adoc' '*.asciidoc' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Expected exactly the allowlisted documentation surface; found:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      # This repository has no Kotlin source. Keeping the Kotlin Gradle plugin
      # adds a build-cache deserialization surface for no product capability.
      - name: Build dependency policy
        run: |
          if git grep -n -E 'kotlin-android|org\.jetbrains\.kotlin\.android' -- 'app/android/*.gradle' 'app/android/**/*.gradle'; then
            echo "Kotlin plugin present without a reviewed Kotlin requirement" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis (strict)
        working-directory: app
        run: flutter analyze

      # The auditor is tested before it is trusted. It previously scanned a
      # hardcoded path and reported CLEAN without ever reading the shipping
      # app; these tests plant real violations and require it to fail.
      - name: Privacy audit self-test
        run: python3 tools/test_privacy_audit.py

      # The product's privacy claims are checked mechanically: prohibited
      # permissions, analytics/ad SDKs, JS bridges, cleartext traffic.
      - name: Privacy audit
        run: python3 tools/privacy_audit.py .

      # The Android unit suite without Gradle. Gradle remains the gate below;
      # this runs first because it needs no Android Gradle Plugin and reports a
      # compile error in seconds rather than after a full configure phase.
      - name: Android unit tests (JVM)
        run: tools/jvm_test.sh

      # FilterEngine verifies the bundled blocklist against a pinned SHA-256
      # and fails closed on mismatch -- blocking silently switches off. Catch
      # a stale pin here, where the cause is obvious, rather than on a phone.
      - name: Filter digest pin
        run: python3 tools/filter_digest_check.py .

      # Widget + golden tests. The committed screen images are the UI
      # regression gate: if a screen drifts, this fails.
      - name: Tests (widgets + screen goldens)
        working-directory: app
        run: flutter test

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/failures
          if-no-files-found: ignore

      # This key and password are public test material, never production trust.
      # Keeping the test signature stable lets a device install each patched CI
      # build as an upgrade, which is required for migration and regression tests.
      - name: Configure stable CI test signing
        run: |
          echo "MRNOBODY_KEYSTORE=$GITHUB_WORKSPACE/.github/ci-test-signing.p12" >> "$GITHUB_ENV"
          echo "MRNOBODY_STORE_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_ALIAS=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"

      # Build one universal artifact. The public distribution is deliberately
      # not split by ABI; size is measured both as downloaded and unpacked.
      - name: Build signed universal CI APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK signature
        working-directory: app
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$apksigner"
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"

      # The Java agent core (routing, filtering, policy, reconciliation) is
      # written to run on a plain JVM precisely so it can be tested without a
      # device. Runs after the APK build, which generates local.properties.
      - name: Tests (Java agent core)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Gate the universal artifact. Report both download and unpacked size;
      # native libraries may be compressed inside an APK.
      - name: APK size gate (universal, 70 MiB unpacked)
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          size=$(stat -c%s "$apk")
          rm -rf /tmp/mr-nobody-apk && mkdir -p /tmp/mr-nobody-apk
          unzip -q "$apk" -d /tmp/mr-nobody-apk
          unpacked=$(du -sb /tmp/mr-nobody-apk | cut -f1)
          echo "universal APK download: $((size / 1024 / 1024)) MiB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "universal APK unpacked: $((unpacked / 1024 / 1024)) MiB ($unpacked bytes)" >> "$GITHUB_STEP_SUMMARY"
          python3 ../tools/apk_size_check.py "$apk" 70
          test "$unpacked" -le $((70 * 1024 * 1024))

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: mrnobody-ci-test-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
