name: Distribution APK

# Builds one signed universal APK for distribution. The APK keeps all native
# ABIs and is size-checked both as downloaded and after unpacking. This
# workflow is manual-only so it never gates a normal push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis (strict)
        working-directory: app
        run: flutter analyze

      - name: Configure distribution test signing
        run: |
          echo "MRNOBODY_KEYSTORE=$GITHUB_WORKSPACE/.github/ci-test-signing.p12" >> "$GITHUB_ENV"
          echo "MRNOBODY_STORE_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_ALIAS=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"

      # No --split-per-abi: this is the single universal APK with all ABIs.
      - name: Build universal signed release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK signature
        working-directory: app
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$apksigner"
          for apk in build/app/outputs/flutter-apk/app-release.apk; do
            test -f "$apk" || continue
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Size gate (70 MiB unpacked)
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          size=$(stat -c%s "$apk")
          rm -rf /tmp/mr-nobody-apk && mkdir -p /tmp/mr-nobody-apk
          unzip -q "$apk" -d /tmp/mr-nobody-apk
          unpacked=$(du -sb /tmp/mr-nobody-apk | cut -f1)
          echo "universal APK download: $((size / 1024 / 1024)) MiB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "universal APK unpacked: $((unpacked / 1024 / 1024)) MiB ($unpacked bytes)" >> "$GITHUB_STEP_SUMMARY"
          python3 ../tools/apk_size_check.py "$apk" 70
          test "$unpacked" -le $((70 * 1024 * 1024))

      - name: Upload universal distribution APK
        uses: actions/upload-artifact@v7
        with:
          name: mrnobody-distribution-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
