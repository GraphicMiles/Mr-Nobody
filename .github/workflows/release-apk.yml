name: Distribution APK

# Builds a single, signed, universal APK for sharing with testers. This is the
# hand-out artifact: one APK that contains all three native ABIs (arm64-v8a,
# armeabi-v7a, x86_64) so it installs on any device, and the app is set to
# support Android 12+ (minSdk 31).
#
# It is separate from the per-ABI "Flutter Build" workflow, which keeps its own
# 45 MiB per-ABI size gate. A universal APK bundles three engines, so it is
# naturally larger than one ABI; the ceiling here is raised to match, and this
# workflow is manual-only so it never gates a normal push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis (strict)
        working-directory: app
        run: flutter analyze

      - name: Configure distribution test signing
        run: |
          echo "MRNOBODY_KEYSTORE=$GITHUB_WORKSPACE/.github/ci-test-signing.p12" >> "$GITHUB_ENV"
          echo "MRNOBODY_STORE_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_ALIAS=mrnobody-ci-test" >> "$GITHUB_ENV"
          echo "MRNOBODY_KEY_PASSWORD=mrnobody-ci-test" >> "$GITHUB_ENV"

      # No --split-per-abi: this is the single universal APK with all ABIs.
      - name: Build universal signed release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK signature
        working-directory: app
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$apksigner"
          for apk in build/app/outputs/flutter-apk/app-release.apk; do
            test -f "$apk" || continue
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Size report
        working-directory: app
        run: |
          for apk in build/app/outputs/flutter-apk/app-release.apk; do
            test -f "$apk" || continue
            size=$(stat -c%s "$apk")
            echo "universal APK: $((size / 1024 / 1024)) MiB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload universal distribution APK
        uses: actions/upload-artifact@v7
        with:
          name: mrnobody-distribution-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
