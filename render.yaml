# Render Blueprint — import from the Render dashboard (New → Blueprint)
# or deploy with the Render CLI. Service details: server/README.md
services:
  - type: web
    name: mrnobody-updates
    runtime: python
    plan: free
    buildCommand: "true" # no dependencies: nothing to build
    startCommand: python3 server/app.py
    healthCheckPath: /health
